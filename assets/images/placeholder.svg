<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    
    <!-- Solar Panel Pattern -->
    <pattern id="solar-grid" width="40" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <rect width="38" height="18" fill="#1E293B" stroke="#0284C7" stroke-width="0.7" rx="1"/>
      <line x1="19" y1="0" x2="19" y2="18" stroke="#38BDF8" stroke-width="0.3"/>
      <line x1="0" y1="9" x2="38" y2="9" stroke="#38BDF8" stroke-width="0.3"/>
    </pattern>
    
    <!-- Sky Glow -->
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#glow)" />

  <!-- Grid lines for engineering aesthetic -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Industrial Factory Building -->
  <g transform="translate(150, 120)">
    <!-- Main Warehouse Base -->
    <path d="M 50,300 L 50,180 L 180,100 L 450,100 L 450,300 Z" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    
    <!-- Roof Shadow/Side -->
    <path d="M 180,100 L 450,100 L 410,70 L 150,70 Z" fill="#0F172A" opacity="0.6" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Front Wall Shadow/Detail -->
    <path d="M 50,180 L 180,100 L 180,300 L 50,300 Z" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Factory Windows -->
    <rect x="75" y="200" width="30" height="50" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="125" y="200" width="30" height="50" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Warehouse Loading Bay Door -->
    <rect x="230" y="180" width="100" height="120" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <path d="M 230,210 H 330 M 230,240 H 330 M 230,270 H 330" stroke="#334155" stroke-width="1"/>
    
    <!-- Solar Panels on the Main Roof (Isometric-like projection) -->
    <!-- We will overlay a polygon with the solar panel grid pattern -->
    <path d="M 190,95 L 440,95 L 420,50 L 175,50 Z" fill="url(#solar-grid)" stroke="#0284C7" stroke-width="2"/>
    
    <!-- Accent Green Energy Flow Glow -->
    <path d="M 300,50 L 320,5 L 290,-35" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10, 5" opacity="0.8"/>
    <circle cx="290" cy="-35" r="5" fill="#10B981" />
  </g>

  <!-- Secondary Office/Substation Building (Right) -->
  <g transform="translate(480, 220)">
    <rect x="0" y="80" width="180" height="120" rx="2" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <polygon points="0,80 180,80 160,50 20,50" fill="#0F172A" opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <!-- Solar panels on this smaller roof -->
    <polygon points="25,75 155,75 140,55 35,55" fill="url(#solar-grid)" stroke="#0284C7" stroke-width="1.5"/>
    
    <!-- Office Windows (Glowing Light Blue-Gray) -->
    <rect x="20" y="110" width="35" height="40" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/>
    <rect x="70" y="110" width="35" height="40" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/>
    <rect x="120" y="110" width="35" height="40" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Typography Labels & Details -->
  <rect x="30" y="30" width="220" height="34" rx="17" fill="rgba(16, 185, 129, 0.1)" stroke="#10B981" stroke-width="1"/>
  <circle cx="47" cy="47" r="6" fill="#10B981"/>
  <text x="63" y="52" fill="#10B981" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">60PYUNG+ TARGET INSTALLATION</text>
  
  <text x="30" y="440" fill="#94A3B8" font-family="'Outfit', sans-serif" font-size="28" font-weight="850" letter-spacing="-0.03em">SOLARLINK</text>
  <text x="30" y="465" fill="#64748B" font-family="'Noto Sans KR', sans-serif" font-size="13" font-weight="500">60평 이상 지붕·건물 태양광 상담 연결 플랫폼</text>
</svg>
